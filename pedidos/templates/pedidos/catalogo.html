<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1f2937;
            font-size: 30px;
        }

        .header p {
            color: #6b7280;
            margin-top: 5px;
        }

        .btn-agregar {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-agregar:hover {
            background: #1d4ed8;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #1f2937;
            color: white;
        }

        th,
        td {
            padding: 16px 20px;
            text-align: left;
        }

        th {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        .nombre {
            font-weight: bold;
            color: #111827;
        }

        .precio {
            color: #059669;
            font-weight: bold;
        }

        .categoria {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .acciones {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 7px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-editar {
            background: #fef3c7;
            color: #92400e;
        }

        .btn-eliminar {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .footer {
            margin-top: 15px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 10px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            th,
            td {
                padding: 12px;
            }

            .acciones {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div>
                <h1>Productos</h1>
                <p>Listado de productos disponibles</p>
            </div>

            <a href="#" class="btn-agregar">
                + Agregar producto
            </a>
        </div>

        <div class="card">
            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for producto in productos %}
                            <tr>
                                <td class="nombre">
                                    {{ producto.nombre }}
                                </td>

                                <td class="precio">
                                    {{ producto.precio }}
                                </td>

                                <td>
                                    <span class="categoria">
                                        {{ producto.categoria }}
                                    </span>
                                </td>

                                <td>
                                    <div class="acciones">
                                        <a href="#" class="btn btn-editar">
                                            Editar
                                        </a>

                                        <a href="#" class="btn btn-eliminar">
                                            Eliminar
                                        </a>
                                    </div>
                                </td>
                                
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="4" class="empty">
                                    No hay productos registrados.
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>
        </div>

    </div>

</body>
</html>
